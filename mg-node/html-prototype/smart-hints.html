<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>智能提示 · mg-node 原型</title>
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="components.css"><link rel="stylesheet" href="app.css">
<style></style></head><body>
<a href="index.html" class="btn btn--sm" style="position:fixed;left:10px;bottom:10px;z-index:400">← 原型目录</a>
<div class="desk"><div data-shell="nolist"></div></div><template id="tpl"><div id="ed" style="flex:1;display:flex;flex-direction:column;min-height:0;position:relative"></div></template><div class="card" style="position:fixed;right:30px;bottom:50px;padding:14px;width:300px;font-size:13px;box-shadow:var(--shadow-md);z-index:50"><b>IDEA 风格智能提示</b><div style="display:flex;flex-direction:column;gap:6px;margin-top:8px"><button class="btn btn--sm" id="h1">⌘⇧P 命令面板</button><button class="btn btn--sm" id="h2">/ 插入菜单</button><button class="btn btn--sm" id="h3">💡 意图动作（Alt+↵）</button><button class="btn btn--sm" id="h4">悬停工具栏查看快捷键</button></div></div>
<div class="menu" id="intent" style="position:fixed;left:520px;top:330px"><div class="menu__hint">💡 第 18 行</div><div class="menu__item">把列表转成表格</div><div class="menu__item">为代码块添加语言 java</div><div class="menu__item">修复：标题层级跳跃 H1 → H3</div></div>
<script>window.page=MG=>{const api=MG.editor(MG.$('#ed'),{mode:'split'});MG.$('#h1').onclick=()=>MG.palette();MG.$('#h2').onclick=()=>api.openSlash();const it=MG.$('#intent');
MG.$('#h3').onclick=e=>{e.stopPropagation();it.classList.toggle('is-open')};it.onclick=e=>{const i=e.target.closest('.menu__item');if(i){MG.toast('已应用：'+i.textContent);it.classList.remove('is-open')}};
document.addEventListener('keydown',e=>{if(e.altKey&&e.key==='Enter')it.classList.toggle('is-open')});MG.$('#h4').onclick=()=>MG.toast('把鼠标移到「预览 / 编辑 / 双栏」上，会显示 ⌘1/2/3')}</script><script src="app.js"></script></body></html>
