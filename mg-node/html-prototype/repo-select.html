<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>选择仓库 · mg-node 原型</title>
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="components.css"><link rel="stylesheet" href="app.css">
<style></style></head><body>
<a href="index.html" class="btn btn--sm" style="position:fixed;left:10px;bottom:10px;z-index:400">← 原型目录</a>
<div class="desk" style="display:flex;align-items:center;justify-content:center"><div class="card" style="width:620px;padding:30px;box-shadow:var(--shadow-md)">
<div style="display:flex;align-items:center;gap:12px"><img class="avatar" id="me" style="width:44px;height:44px" alt=""><div><b style="font-size:20px">选择笔记仓库</b><div class="muted">已登录 GitHub · davin-dev</div></div></div>
<input class="field" id="q" placeholder="🔍 搜索仓库" style="margin:18px 0 10px"><div id="repos"></div>
<div style="border:1px dashed var(--c-line-strong);border-radius:10px;padding:12px;margin-top:10px;cursor:pointer" id="newRepo">＋ 新建私有仓库 <b>my-git-note</b> <span class="muted">（推荐，自动初始化目录结构）</span></div>
<div class="label">默认分支</div><div class="seg" id="br"><button class="seg__item is-active">main</button><button class="seg__item">notes</button></div>
<div class="modal__foot"><a class="btn" href="login.html">返回</a><button class="btn btn--primary" id="ok">进入 mg-node →</button></div></div></div>
<script>window.page=MG=>{MG.$('#me').src=MG.av();const R=[['davin-dev/my-git-note','🔒 私有 · 104 篇笔记 · 2 小时前'],['davin-dev/blog','🌐 公开 · Hexo'],['davin-dev/dotfiles','🔒 私有'],['team/wiki','🔒 私有 · 组织']];let sel=0;
const draw=()=>{const q=MG.$('#q').value;MG.$('#repos').innerHTML=R.map((r,i)=>r[0].includes(q)?`<div class="card card--select ${i===sel?'is-active':''}" data-i="${i}" style="margin-bottom:8px;padding:12px 14px"><b>${r[0]}</b> <span class="muted">${r[1]}</span>${r[1].includes('公开')?' <span class="badge badge--warn">公开仓库不建议存私人笔记</span>':''}</div>`:'').join('')};draw();
MG.$('#q').oninput=draw;MG.$('#repos').onclick=e=>{const c=e.target.closest('[data-i]');if(c){sel=+c.dataset.i;draw()}};
MG.$('#newRepo').onclick=()=>MG.toast('已创建 davin-dev/my-git-note（私有）');MG.$('#ok').onclick=()=>{MG.toast('正在克隆 '+R[sel][0]+' …');setTimeout(()=>location.href='main.html',700)}}</script><script src="app.js"></script></body></html>
