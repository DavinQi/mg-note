<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>本地导入 · mg-node 原型</title>
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="components.css"><link rel="stylesheet" href="app.css">
<style></style></head><body>
<a href="index.html" class="btn btn--sm" style="position:fixed;left:10px;bottom:10px;z-index:400">← 原型目录</a>
<div class="desk"><div data-shell></div></div><template id="tpl"><div id="ed" style="flex:1;display:flex;flex-direction:column;min-height:0;position:relative"></div></template><div class="modal-mask is-open" id="imp"><div class="modal" style="width:960px;padding:0;display:flex;flex-direction:column;max-height:88vh">
<div style="display:flex;align-items:center;gap:10px;padding:20px 24px;border-bottom:1px solid var(--c-line)"><div class="modal__title">📥 导入本地文件</div><span class="muted">⌘I · 也可以拖到侧栏的笔记本上</span><span class="spacer"></span><button class="btn btn--sm" id="addF">＋ 添加文件</button><button class="btn btn--sm" id="addD">＋ 添加文件夹</button></div>
<div style="display:flex;min-height:0;flex:1"><div style="flex:1.3;padding:16px 24px;overflow:auto;font-family:var(--f-mono);font-size:12.5px;line-height:2;border-right:1px solid var(--c-line)" id="tree"></div>
<div style="flex:1;padding:16px 24px;overflow:auto"><span class="label" style="margin-top:0">导入到</span><select class="field"><option>📚 新建笔记本「tech-notes」</option><option>后端开发</option><option>📥 收集笔记</option></select>
<span class="label">选项</span><div style="font-size:13px;line-height:2.1" id="opts"><div><span class="switch is-on"></span> 保留文件夹结构为笔记本</div><div><span class="switch is-on" data-o="conv"></span> DOCX / HTML 转为 Markdown <span class="muted">（保留原件）</span></div><div><span class="switch is-on"></span> 图片移到 assets/ 并改写链接</div><div><span class="switch is-on"></span> 自动生成 front-matter</div><div><span class="switch" data-o="hidden"></span> 导入隐藏文件</div></div>
<span class="label">重名处理</span><div class="seg" id="dup"><button class="seg__item">跳过</button><button class="seg__item is-active">重命名</button><button class="seg__item">覆盖</button></div>
<span class="label">文件类型汇总</span><div><span class="badge">MD 42</span><span class="badge">DOCX 6</span><span class="badge">PDF 9</span><span class="badge">PPTX 3</span><span class="badge">HTML 4</span><span class="badge">图片 37</span><span class="badge badge--warn">大文件 1</span></div><div class="muted" style="margin-top:8px" id="sum">共 104 个文件 · 312 MB · 已忽略 1,288 个</div></div></div>
<div id="progBox" style="display:none;padding:16px 24px;border-top:1px solid var(--c-line)"><div style="display:flex;font-size:13px"><span id="pt">准备中…</span><span class="spacer"></span><b id="pn">0 / 104</b></div><div class="progress" style="margin-top:8px"><div class="progress__bar" id="pb"></div></div><div id="steps" class="muted" style="margin-top:8px;line-height:1.9"></div></div>
<div style="display:flex;align-items:center;gap:10px;padding:14px 24px;border-top:1px solid var(--c-line)"><span class="muted" id="foot">导入后只生成 1 次提交并同步，然后建立搜索和 AI 索引</span><span class="spacer"></span><button class="btn" id="cancel">取消</button><button class="btn btn--primary" id="start">开始导入 104 个文件</button></div></div></div>
<script>window.page=MG=>{MG.editor(MG.$('#ed'),{mode:'preview'});
const T=[[0,'☑ 📁 ~/Documents/tech-notes',''],[1,'☑ 📁 后端/ → 笔记本「后端」',''],[2,'☑ 📄 redis-集群.md','<span class="badge">MD</span>'],[2,'☑ 📄 接口设计规范.docx','<span class="badge">DOCX→MD</span>'],[2,'☑ 🖼 架构图.png → assets/',''],[1,'☑ 📁 运维/',''],[2,'☑ 📄 k8s-排障.pdf','<span class="badge">PDF</span>'],[2,'<span style="color:var(--c-warn)">☑ 📄 压测录屏.mp4 · 186 MB ⚠ 建议 LFS</span>',''],[1,'☑ 📄 周会分享.pptx','<span class="badge">PPTX</span>'],[1,'<span style="color:var(--c-danger)">⚠ 📄 redis-缓存穿透.md · 已存在 → 重命名为 (2)</span>',''],[1,'<span style="color:var(--c-muted)">☐ 📁 .git/ · node_modules/ · .DS_Store（已忽略）</span>','']];
const tree=MG.$('#tree');const draw=()=>tree.innerHTML='<b style="font-family:var(--f-sans)">来源预览</b> <span class="muted">'+T.filter(x=>x[0]===0).length+' 个来源</span><br>'+T.map(t=>`<div style="padding-left:${t[0]*18}px">${t[1]} ${t[2]}</div>`).join('');draw();
MG.$('#addF').onclick=()=>{T.push([0,'☑ 📄 ~/Downloads/会议纪要.txt','<span class="badge">TXT→MD</span>']);draw();MG.toast('已添加 1 个文件')};
MG.$('#addD').onclick=()=>{T.push([0,'☑ 📁 ~/Desktop/读书笔记','<span class="muted">12 个文件</span>']);draw();MG.toast('已添加文件夹')};
MG.$('#dup').addEventListener('seg',e=>{T[9][1]=`<span style="color:var(--c-danger)">⚠ 📄 redis-缓存穿透.md · 已存在 → ${{'跳过':'跳过','重命名':'重命名为 (2)','覆盖':'覆盖（旧版本留在 git 历史）'}[e.detail]}</span>`;draw()});
let t=null;const S=['扫描与过滤','复制图片到 assets/ 并改写链接','转换并生成 front-matter','本地提交「mg-node: import tech-notes (104 files)」','同步到 davin-dev/my-git-note','建立搜索和 AI 索引'];
const stop=()=>{clearInterval(t);t=null};
MG.$('#start').onclick=()=>{if(MG.$('#start').dataset.done){MG.$('#imp').classList.remove('is-open');return}MG.$('#progBox').style.display='';MG.$('#start').disabled=true;let n=0;
 t=setInterval(()=>{n+=2;const st=Math.min(5,Math.floor(n/104*6));MG.$('#pb').style.width=Math.min(100,n/104*100)+'%';MG.$('#pn').textContent=Math.min(n,104)+' / 104';MG.$('#pt').textContent='正在处理：'+S[st];
  MG.$('#steps').innerHTML=S.map((s,i)=>i<st?'✓ '+s:i===st?'<b style="color:var(--c-primary)">⟳ '+s+'</b>':'○ '+s).join('<br>');
  if(n>=104){stop();MG.$('#steps').innerHTML='<b>结果：</b><span style="color:var(--c-success)">成功 98</span> · <span style="color:var(--c-primary)">重命名 3</span> · <span style="color:var(--c-warn)">跳过 2</span> · <span style="color:var(--c-danger)">失败 1（旧版周报.doc：不支持 .doc，请另存为 .docx）</span>';
   MG.$('#pt').textContent='✓ 导入完成';MG.$('#start').disabled=false;MG.$('#start').textContent='完成';MG.$('#start').dataset.done=1;MG.$('#cancel').textContent='导出报告';MG.toast('已导入 101 个文件并同步')}},60)};
MG.$('#cancel').onclick=()=>{if(t){stop();MG.$('#pt').textContent='已取消，临时目录已清理，工作区未改动';MG.$('#start').disabled=false;MG.toast('导入已取消')}else if(MG.$('#start').dataset.done)MG.toast('已导出 import-report.md');else MG.$('#imp').classList.remove('is-open')}}</script><script src="app.js"></script></body></html>
