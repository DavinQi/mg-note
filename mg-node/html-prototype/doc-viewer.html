<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>文档查看 · mg-node 原型</title>
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="components.css"><link rel="stylesheet" href="app.css">
<style></style></head><body>
<a href="index.html" class="btn btn--sm" style="position:fixed;left:10px;bottom:10px;z-index:400">← 原型目录</a>
<div class="desk"><div data-shell></div></div><template id="tpl"><div class="ed-head"><span class="ed-head__title">技术分享：缓存设计.pptx</span><div class="seg" id="kind"><button class="seg__item is-active" data-v="pptx">PPTX</button><button class="seg__item" data-v="pdf">PDF</button><button class="seg__item" data-v="docx">DOCX</button></div><span class="badge">只读预览 · 批注存 .mgnote/annot</span><button class="btn btn--sm" id="ext">用 WPS 打开</button></div>
<div class="toolbar" id="tools"><div class="toolbar__group"><div class="toolbar__row"><button class="toolbar__btn chip is-active" data-t="hl">🖍 高亮</button><button class="toolbar__btn chip chip--off" data-t="note">📝 便签</button><button class="toolbar__btn chip chip--off" data-t="pen">✏️ 画笔</button></div><div class="toolbar__label">批注（点击页面添加）</div></div><div class="toolbar__group"><div class="toolbar__row"><button class="toolbar__btn" id="zo">－</button><span id="zv" style="padding:3px 6px">100%</span><button class="toolbar__btn" id="zi">＋</button></div><div class="toolbar__label">缩放</div></div></div>
<div style="flex:1;display:flex;min-height:0"><div style="width:150px;border-right:1px solid var(--c-line);padding:10px;overflow:auto" id="thumbs"></div>
<div style="flex:1;overflow:auto;background:var(--c-surface-3);display:flex;justify-content:center;padding:24px"><div id="pagev" style="width:720px;height:405px;background:#fff;box-shadow:var(--shadow-md);position:relative;padding:40px;transform-origin:top center;cursor:crosshair;color:#1f2433"></div></div></div></template>
<script>window.page=MG=>{const D={pptx:['技术分享：缓存设计.pptx',['缓存设计 · 封面','三大问题：穿透 / 击穿 / 雪崩','布隆过滤器原理','压测结果'],'720px','405px'],pdf:['K8s HPA 压测记录.pdf',['第 1 页 · 摘要','第 2 页 · 环境','第 3 页 · 结论'],'560px','760px'],docx:['接口规范模板.docx',['1. 命名规范','2. 错误码','3. 鉴权'],'600px','760px']};
const U=new URLSearchParams(location.search);let kind=U.get('kind')||'pptx',pg=0,tool='hl',z=1;if(U.get('new')){const ex='.'+kind;D[kind]=[U.get('new')+ex,kind==='pptx'?['空白标题页 · 单击添加标题']:['（空白文档）'],D[kind][2],D[kind][3]];setTimeout(()=>{MG.$$('#kind .seg__item').forEach(b=>b.classList.toggle('is-active',b.dataset.v===kind));const sb=MG.$('.statusbar span');if(sb)sb.textContent='notes/'+U.get('folder')+'/'+U.get('new').replace(/\s+/g,'-')+ex;MG.toast('已从内置空白模板创建 '+ex+'，点「用 WPS 打开」编辑')},50)}const v=MG.$('#pagev');
const draw=()=>{const d=D[kind];MG.$('.ed-head__title').textContent=d[0];v.style.width=d[2];v.style.height=d[3];v.innerHTML=`<div style="font-size:${kind==='pptx'?30:22}px;font-weight:800">${d[1][pg]}</div><p style="margin-top:16px;color:#555;line-height:1.8">示例内容：${d[1][pg]}。点击页面任意位置添加批注。</p>`;
 MG.$('#thumbs').innerHTML=d[1].map((t,i)=>`<div data-i="${i}" style="border:2px solid ${i===pg?'var(--c-primary)':'var(--c-line)'};border-radius:6px;padding:8px;font-size:11px;margin-bottom:8px;cursor:pointer;background:#fff;color:#333;height:${kind==='pptx'?60:90}px">${i+1}. ${t}</div>`).join('')};draw();
MG.$('#kind').addEventListener('seg',e=>{kind=e.detail.toLowerCase();pg=0;draw()});MG.$('#thumbs').onclick=e=>{const t=e.target.closest('[data-i]');if(t){pg=+t.dataset.i;draw()}};
MG.$('#tools').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;tool=b.dataset.t;MG.$$('[data-t]').forEach(x=>{x.classList.toggle('is-active',x===b);x.classList.toggle('chip--off',x!==b)})};
v.onclick=e=>{const r=v.getBoundingClientRect(),x=(e.clientX-r.left)/z,y=(e.clientY-r.top)/z;const m=document.createElement('div');m.style.cssText=`position:absolute;left:${x-10}px;top:${y-10}px;font-size:12px;`;
 m.innerHTML=tool==='hl'?'<span style="background:#fff2a8;padding:2px 30px;opacity:.8"></span>':tool==='note'?'<span style="background:#fff8c5;border:1px solid #f0d860;padding:4px 8px;border-radius:4px;box-shadow:var(--shadow-sm)">📝 这里补充数据</span>':'<span style="color:#e33;font-size:20px">〰〰</span>';v.appendChild(m);MG.toast('批注已保存到 sidecar 文件')};
const zm=d=>{z=Math.max(.5,Math.min(2,z+d));v.style.transform=`scale(${z})`;MG.$('#zv').textContent=Math.round(z*100)+'%'};MG.$('#zi').onclick=()=>zm(.1);MG.$('#zo').onclick=()=>zm(-.1);
MG.$('#ext').onclick=()=>MG.toast('已用 WPS 打开，保存后 mg-node 会检测到修改')}</script><script src="app.js"></script></body></html>
